name: Meeting reminders

# Why this exists: the reminder + follow-up job used to be a NETLIFY scheduled function
# (netlify/functions/meet-reminders.mts, every 15 min). The site now runs on Railway, which
# does not run Netlify functions and has no cron of its own — so nothing has been calling the
# endpoint and no meeting reminders were going out. This workflow does the calling.
#
# Secret required (repo → Settings → Secrets and variables → Actions → New repository secret):
#   CRON_SECRET  — the exact same value as the CRON_SECRET variable on Railway.
#
# Note: GitHub's scheduled runs are best-effort and can be several minutes late. That is fine
# here — the endpoint sends the most imminent unsent reminder and marks long-missed ones as
# handled, so a late run means a slightly late reminder, never a duplicate.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: {} # lets us trigger it by hand to test

# A slow run must never stack up behind the next one.
concurrency:
  group: meet-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due meeting reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set — the endpoint would reject us. Add it in repo secrets."
            exit 1
          fi
          out=$(curl -sS -m 60 -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "https://avloryn.com/api/meet/cron/reminders")
          code=$(echo "$out" | tail -n1)
          echo "$out" | sed '$d'
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
