name: System watch

# Catches the failures nobody sees: a revoked calendar grant, a cron that stopped running, a
# leaver whose referral code kept earning, a jammed generation queue. Covers BOTH Avloryn and
# LivoDraft — LivoDraft reports its own checks and the portal does the alerting for both.
#
# Deliberately a SEPARATE workflow from meet-reminders: if reminders start failing, the thing that
# reports it has to still be alive. One job doing both would go quiet at exactly the wrong moment.
#
# Secret required (repo → Settings → Secrets and variables → Actions):
#   CRON_SECRET — the same value as CRON_SECRET on Railway. (Already set for meet-reminders.)
#
# Hourly, not every 15 minutes: these checks call Google and Zoho, and nothing here is so urgent
# that an hour's delay matters. Alerting is throttled in the app anyway — first failure, then a
# day, three days, a week — so this cadence never turns into a stream of email.

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the hour so it isn't queued behind everyone else's jobs
  workflow_dispatch: {} # run it by hand any time

concurrency:
  group: system-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check everything and alert on what is broken
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set — the endpoint would reject us. Add it in repo secrets."
            exit 1
          fi
          out=$(curl -sS -m 180 -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "https://avloryn.com/api/cron/monitor")
          code=$(echo "$out" | tail -n1)
          body=$(echo "$out" | sed '$d')
          echo "$body"
          echo "HTTP $code"
          # A non-200 means the watchdog itself could not run — that is a failure of this workflow,
          # and a red run here is the last line of defence when even the alert email cannot send.
          [ "$code" = "200" ] || exit 1
