# Netlify build config for the Next.js 16 app.
# The Next.js runtime plugin handles publish dir, SSR, API routes, ISR and
# image handling — do NOT set `publish` manually (it breaks routing).

[build]
  command = "next build"

[build.environment]
  NODE_VERSION = "22"
  # Bigger V8 heap — the TS type-check phase (googleapis types are huge) OOMs on the default ~2 GB.
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"
